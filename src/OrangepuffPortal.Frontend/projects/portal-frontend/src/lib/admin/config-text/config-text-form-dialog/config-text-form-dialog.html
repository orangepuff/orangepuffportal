<h2 mat-dialog-title>{{ isEdit ? 'Edit text' : 'Add text' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="config-text-form-dialog__content">
    <mat-form-field appearance="outline">
      <mat-label>Module</mat-label>
      <input matInput formControlName="sModule" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Text code</mat-label>
      <input matInput formControlName="sTextCode" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Culture code</mat-label>
      <input matInput formControlName="sCultureCode" />
      <mat-hint>Use "*" for the culture-independent fallback row</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Text type</mat-label>
      <input matInput formControlName="sTextType" />
      <mat-hint>"lbl" or "msg"</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Text</mat-label>
      <textarea matInput formControlName="sText" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Note</mat-label>
      <input matInput formControlName="sNote" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="form.invalid">Save</button>
  </mat-dialog-actions>
</form>
