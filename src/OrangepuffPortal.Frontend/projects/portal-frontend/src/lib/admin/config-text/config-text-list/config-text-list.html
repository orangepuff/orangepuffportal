<div class="config-text-list">
  <div class="config-text-list__toolbar">
    <h1>Config text</h1>
    <button mat-flat-button type="button" (click)="openAddDialog()">Add text</button>
  </div>

  <form [formGroup]="filterForm" (ngSubmit)="applyFilter()" class="config-text-list__filters">
    <mat-form-field appearance="outline">
      <mat-label>Module</mat-label>
      <input matInput formControlName="module" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Text code</mat-label>
      <input matInput formControlName="textCode" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Culture code</mat-label>
      <input matInput formControlName="cultureCode" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Text type</mat-label>
      <input matInput formControlName="textType" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Text contains</mat-label>
      <input matInput formControlName="text" />
    </mat-form-field>

    <button mat-flat-button type="submit">Search</button>
    <button mat-button type="button" (click)="clearFilter()">Clear</button>
  </form>

  <table mat-table [dataSource]="rows()" class="config-text-list__table">
    <ng-container matColumnDef="sModule">
      <th mat-header-cell *matHeaderCellDef>Module</th>
      <td mat-cell *matCellDef="let row">{{ row.sModule }}</td>
    </ng-container>

    <ng-container matColumnDef="sTextCode">
      <th mat-header-cell *matHeaderCellDef>Text code</th>
      <td mat-cell *matCellDef="let row">{{ row.sTextCode }}</td>
    </ng-container>

    <ng-container matColumnDef="sCultureCode">
      <th mat-header-cell *matHeaderCellDef>Culture</th>
      <td mat-cell *matCellDef="let row">{{ row.sCultureCode }}</td>
    </ng-container>

    <ng-container matColumnDef="sTextType">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let row">{{ row.sTextType }}</td>
    </ng-container>

    <ng-container matColumnDef="sText">
      <th mat-header-cell *matHeaderCellDef>Text</th>
      <td mat-cell *matCellDef="let row">{{ row.sText }}</td>
    </ng-container>

    <ng-container matColumnDef="sNote">
      <th mat-header-cell *matHeaderCellDef>Note</th>
      <td mat-cell *matCellDef="let row">{{ row.sNote ?? '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button type="button" (click)="openEditDialog(row)" aria-label="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button type="button" (click)="deleteRow(row)" aria-label="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [length]="totalCount()" [pageSize]="50" [pageSizeOptions]="pageSizeOptions" (page)="onPage($event)"></mat-paginator>
</div>
