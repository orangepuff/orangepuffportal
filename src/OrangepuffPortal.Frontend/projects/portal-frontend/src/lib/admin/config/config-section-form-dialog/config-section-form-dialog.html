<h2 mat-dialog-title>{{ isEdit ? 'Edit section' : 'Add section' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="config-section-form-dialog__content">
    <mat-form-field appearance="outline">
      <mat-label>Module</mat-label>
      <input matInput formControlName="sModule" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Section description</mat-label>
      <input matInput formControlName="sSectionDesc" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Text code (i18n key)</mat-label>
      <input matInput formControlName="sTextCode" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Sort order</mat-label>
      <input matInput type="number" formControlName="iSortOrder" />
    </mat-form-field>

    <mat-checkbox formControlName="btShow">Shown in a settings UI</mat-checkbox>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="form.invalid">Save</button>
  </mat-dialog-actions>
</form>
