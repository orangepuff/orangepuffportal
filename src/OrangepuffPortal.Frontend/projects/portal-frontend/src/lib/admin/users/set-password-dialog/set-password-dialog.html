<h2 mat-dialog-title>Set password for {{ data.username }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="set-password-dialog__content">
    <mat-form-field appearance="outline">
      <mat-label>New password</mat-label>
      <input matInput type="password" formControlName="newPassword" autocomplete="new-password" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Confirm password</mat-label>
      <input matInput type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </mat-form-field>

    @if (mismatch()) {
      <p class="set-password-dialog__error">Passwords do not match.</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="form.invalid || mismatch()">Save</button>
  </mat-dialog-actions>
</form>
