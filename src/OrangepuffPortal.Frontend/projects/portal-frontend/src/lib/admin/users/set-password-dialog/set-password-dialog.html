<h2 mat-dialog-title>{{ title }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="set-password-dialog__content">
    <mat-form-field appearance="outline">
      <mat-label>{{ 'admin.users.setPasswordDialog.newPassword' | translate:module }}</mat-label>
      <input matInput type="password" formControlName="newPassword" autocomplete="new-password" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'admin.users.setPasswordDialog.confirmPassword' | translate:module }}</mat-label>
      <input matInput type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </mat-form-field>

    @if (mismatch()) {
      <p class="set-password-dialog__error">{{ 'passwordMismatch' | translate:'OrangepuffPortal.Common' }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">{{ 'cancel' | translate:'OrangepuffPortal.Common' }}</button>
    <button mat-flat-button type="submit" [disabled]="form.invalid || mismatch()">{{ 'save' | translate:'OrangepuffPortal.Common' }}</button>
  </mat-dialog-actions>
</form>
